[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pgx-translator"
version = "1.1.0"
description = "Convert Quest Diagnostics pharmacogenomics reports into Morpheus Precision Health reports"
requires-python = ">=3.9"
dependencies = ["pdfplumber>=0.10", "reportlab>=4.0", "python-docx>=1.0"]

[project.optional-dependencies]
web = ["flask>=2.2"]
test = ["pytest>=7"]

[project.scripts]
pgx-translate = "pgx_translator.__main__:main"
pgx-translate-web = "pgx_translator.web:main"

[tool.setuptools]
packages = ["pgx_translator"]

[tool.setuptools.package-data]
pgx_translator = ["assets/*.png", "assets/fonts/*"]
